services:
  mysql:
    image: mysql:8.0
    container_name: job-platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: job_application_db
    ports:
      - "3311:3306"
    volumes:
      - job_platform_mysql_data:/var/lib/mysql

volumes:
  job_platform_mysql_data: